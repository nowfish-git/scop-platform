version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scop
      POSTGRES_PASSWORD: scop_dev_2026
      POSTGRES_DB: scop_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scop -d scop_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scop-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.7.0
    container_name: scop-emqx
    restart: unless-stopped
    ports:
      - '1883:1883'   # MQTT
      - '8083:8083'   # WebSocket
      - '18083:18083' # Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: scop_admin_2026
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: scop-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  es_data:
